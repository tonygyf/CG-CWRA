seed: 7
experiment_name: cgcwra_research_smoke
output_dir: outputs/experiments/research_smoke

model:
  hidden_size: 16
  num_heads: 4
  num_layers: 2
  mlp_ratio: 2.0
  dropout: 0.0
  coordinate_hidden_size: 8
  relative_hidden_size: 8

dataset:
  name: synthetic_cross_window
  task_type: classification
  train_file: data/processed/smoke/train.jsonl
  val_file: data/processed/smoke/val.jsonl
  test_file: data/processed/smoke/test.jsonl
  max_windows: 4
  patches_per_window: 6
  num_classes: 3
  feature_dim: 16

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  epochs: 4
  align_loss_weight: 0.0
  freeze_vision_encoder: true
  freeze_language_model: true
  gradient_accumulation_steps: 1

baselines:
  - name: monkey
    variant: monkey
    enabled: true
  - name: textmonkey
    variant: textmonkey
    enabled: true
  - name: mini_monkey
    variant: mini_monkey
    enabled: true
  - name: cgcwra
    variant: cgcwra
    enabled: true

resources:
  num_workers: 0
  use_amp: false
  devices: 1
  max_cpu_threads: 4

logging:
  log_interval: 5
  save_predictions: true
  save_plots: true
  report_name: research_report.json

search:
  enabled: true
  learning_rates: [1.0e-4, 3.0e-4]
  weight_decays: [0.0, 0.01]
  seeds: [7, 13]
