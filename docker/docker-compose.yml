services:
  cgcwra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    image: cgcwra-env:latest
    container_name: cgcwra-container
    working_dir: /workspace/cgcwra
    environment:
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      HF_HOME: /workspace/cgcwra/artifacts/hf_cache
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
      PYTHONPATH: /workspace/cgcwra/src
    volumes:
      - ..:/workspace/cgcwra
      - ${HOST_DATA_DIR:-../data}:/workspace/cgcwra/data
      - ${HOST_CHECKPOINT_DIR:-../artifacts/checkpoints}:/workspace/cgcwra/artifacts/checkpoints
      - ${HOST_PRETRAINED_DIR:-../artifacts/pretrained}:/workspace/cgcwra/artifacts/pretrained
      - ${HOST_HF_CACHE_DIR:-../artifacts/hf_cache}:/workspace/cgcwra/artifacts/hf_cache
      - ${HOST_OUTPUTS_DIR:-../outputs}:/workspace/cgcwra/outputs
      - ${HOST_REPORTS_DIR:-../reports}:/workspace/cgcwra/reports
    ipc: host
    gpus: all
    init: true
    tty: true
    stdin_open: true
    command: /bin/bash
    healthcheck:
      test: ["CMD-SHELL", "python -m cgcwra.train.cli configs/train/research_smoke.yaml --dry-run >/tmp/healthcheck.log 2>&1 || cat /tmp/healthcheck.log"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
